# Cloudflare Worker for the Telegram bot. Deploy with: npm run bot:deploy
name = "website-parser-bot"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
GITHUB_REPO = "KhalusIvan/website-parser"
GITHUB_REF = "main"
GITHUB_WORKFLOW = "scrape.yml"
# Telegram user IDs that may use the bot, comma-separated. Send /id to the bot to see yours.
ALLOWED_USER_IDS = ""

# Secrets are not stored in this file. Set them once with:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN --config bot/wrangler.toml
#   npx wrangler secret put GITHUB_TOKEN --config bot/wrangler.toml
