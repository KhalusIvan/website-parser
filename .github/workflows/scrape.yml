# Runs a scraper. Started by the Telegram bot (bot/), or by hand: Actions -> Scrape -> Run workflow.
# Progress and the Excel file go to the Telegram chat that started it. The file is also kept as a
# workflow artifact for 30 days (download it on the run page).
name: Scrape
run-name: "${{ inputs.source || 'vroda' }} · ${{ inputs.lang || 'ua' }} · ${{ inputs.mode || 'all' }}${{ inputs.url && format(' · {0}', inputs.url) || '' }}"

on:
  workflow_dispatch:
    inputs:
      source:
        description: Website
        type: choice
        options: [vroda, jrl, mrd, babyliss, gama, immortal, jaguar, kucheryawiy, moser, spl, spl4barber, gloriana] # add new source ids here
        default: vroda
      lang:
        description: Language
        type: choice
        options: [ua, ru]
        default: ua
      mode:
        description: What to scrape
        type: choice
        options: [all, category]
        default: all
      url:
        description: Category URL (only for mode = category)
        type: string
        required: false
        default: ""
      chat_id:
        description: Telegram chat ID for progress and the file (empty = repository variable TELEGRAM_CHAT_ID)
        type: string
        required: false
        default: ""
  # Uncomment to refresh the whole site automatically (uses the defaults above: vroda, ua, all).
  # schedule:
  #   - cron: "0 3 * * 1" # every Monday 03:00 UTC

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: scrape-${{ inputs.source || 'vroda' }}-${{ inputs.lang || 'ua' }}
      cancel-in-progress: false
    env:
      CHAT_ID: ${{ inputs.chat_id || vars.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: dependencies can't run their own code while installing
      - run: npm ci --ignore-scripts

      - name: Scrape
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IN_SOURCE: ${{ inputs.source || 'vroda' }}
          IN_LANG: ${{ inputs.lang || 'ua' }}
          IN_MODE: ${{ inputs.mode || 'all' }}
          IN_URL: ${{ inputs.url }}
        run: >-
          node src/cli.js "$IN_SOURCE" --lang "$IN_LANG" --mode "$IN_MODE" --url "$IN_URL"
          --out-dir output --telegram-chat "$CHAT_ID"

      - name: Keep a copy as a workflow artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: excel-${{ github.run_id }}
          path: output/*.xlsx
          if-no-files-found: ignore
          retention-days: 30

      # The scraper reports its own errors to Telegram. This covers everything else:
      # setup failures, a cancelled run (e.g. from the bot) or the time limit.
      - name: Tell Telegram the run did not finish
        if: (failure() || cancelled()) && env.CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ inputs.source || 'vroda' }} · ${{ inputs.lang || 'ua' }} · ${{ inputs.mode || 'all' }} ${{ inputs.url }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          [ -f output/.telegram-notified ] && exit 0
          if [ "$STATUS" = "cancelled" ]; then text="⏹ Збір скасовано або перевищено час: $TITLE"; else text="❌ Збір завершився з помилкою: $TITLE"; fi
          curl -sS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${text}
          Logs: ${RUN_URL}"
